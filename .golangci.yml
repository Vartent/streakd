version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - gocritic
    - misspell
    - unconvert
  settings:
    depguard:
      rules:
        core-purity:
          files:
            - "**/internal/core/**"
          deny:
            - pkg: github.com/jackc/pgx
              desc: core must stay pure (no DB)
            - pkg: net/http
              desc: core must stay pure (no transport)

run:
  timeout: 5m
